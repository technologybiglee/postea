services:
  api:
    build:
      context: .
      target: development
    container_name: api-post
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - api-network

  db:
    image: postgres:16-alpine
    container_name: api-post-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_post
      POSTGRES_PASSWORD: admin_post
      POSTGRES_DB: api_post_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_post -d api_post_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api-network

volumes:
  postgres_data:

networks:
  api-network:
    driver: bridge
